<!-- Page Wrapper -->
<div id="wrapper">
  <!-- Content Wrapper -->

  <!--Para que aparezca el menú, colocar la siguiente línea en los componentes donde se necesite-->
  <app-menu></app-menu>


  <div id="content-wrapper" class="d-flex flex-column">

    <!-- Main Content -->
    <div id="content">

      <!-- Topbar -->
      <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

        <!-- Sidebar Toggle (Topbar) -->
        <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
          <i class="fa fa-bars"></i>
        </button>



        <!-- Topbar Navbar -->
        <ul class="navbar-nav ml-auto">

          <div class="topbar-divider d-none d-sm-block"></div>

          <!-- Nav Item - User Information -->
          <li class="nav-item dropdown no-arrow">

            <span class="mr-2 d-none d-lg-inline text-gray-600 small">{{user}}</span>
            <img class="img-profile rounded-circle" src="img/undraw_profile.svg">

          </li>

        </ul>

      </nav>
      <!-- End of Topbar -->

      <!-- Begin Page Content -->
      <div class="container-fluid">

        <!-- Content Row -->

        <div class="row">

          <!--AQUI EL CONTENIDO CENTRAL-->

          <div class="container-fluid mt-4">
            <div class="row">
              <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                  <li class="breadcrumb-item"><a href="/noticia">Inicio</a></li>
                  <li class="breadcrumb-item active" aria-current="page">Noticias</li>
                </ol>
              </nav>
              <div class="col-md-12 d-flex justify-content-center">
                <div class="page-header">
                  <h1>
                    <small>Usuarios</small>
                  </h1>
                </div>
              </div>
            </div>

            <!--CONTENIDO-->
            <div class="row">
              <div class="col-md-10">
               
                <!--INICIA TABLA-->
                <div class="table-responsive">
                  <table class="table table-striped table-td">
                    <thead>
                      <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Correo</th>
                        <th scope="col">Rol</th>
                        <th scope="col">Fecha Registro</th>
                        <th scope="col">Editar</th>
                        <th scope="col">Eliminar</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let item of userList"> 
                        <td>{{item.nombre}}</td>
                        <td>{{item.correo}}</td>
                        <td>{{item.rol}}</td>
                        <td>{{item.fechaRegistro}}</td>
                        <td><button type="button" class="btn btn-primary" (click)="toggleEditUser(item._id)">
                            <i class="bi bi-pencil-square"></i>
                          </button></td>
                        <td><button type="button" class="btn btn-primary" (click)="deleteUserEntry(item._id)">
                            <i class="bi bi-trash"></i>
                          </button></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <!--TERMINA TABLA-->
                <form *ngIf="editableUser" class="card p-2" (ngSubmit)="updateUserEntry()" [formGroup]="userForm">
                  <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" aria-describedby="emailHelp"
                      placeholder="Nombre de usuario" formControlName="nombre">
                  </div>
                  <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="text" class="form-control" id="correo" aria-describedby="emailHelp"
                      placeholder="Correo de usuario" formControlName="correo">
                  </div>
                  <div class="mb-3">
                    <label for="contraseña" class="form-label">Contraseña</label>
                    <input type="text" class="form-control" id="contraseña" placeholder="contraseña del usuario"
                      formControlName="contraseña">
                  </div>
                  <div class="mb-3">
                    <label for="rol" class="form-label">Rol</label>
                    <input type="text" class="form-control" id="rol" placeholder="rol(administrador/lector/editor)"
                      formControlName="rol">
                      </div>
                                                                                     
                  <div class="mb-3">
                    <label for="fechaRegistro" class="form-label">Fecha Registro</label>
                    <input type="date" class="form-control" id="fechaRegistro" placeholder="Fecha de Publicacion" formControlName="fechaRegistro">
                  </div>
                                                     
                  <div class="input-group justify-content-center md-12">
                    <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
              

          <!--Termina el CONTENIDO CENTRAL-->

        </div>

      </div>
      <!-- /.container-fluid -->

    </div>

    <!-- End of Main Content -->

    <!-- Footer -->
    <footer class="sticky-footer bg-white">
      <div class="container my-auto">
        <div class="copyright text-center my-auto">
          <span>Copyright &copy; Noti-Web</span>
        </div>
      </div>
    </footer>
    <!-- End of Footer -->

  </div>
  <!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->
